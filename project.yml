name: WallpaperApp
options:
  deploymentTarget:
    iOS: "17.0"

packages:
  WallpaperKit:
    path: .

targets:
  WallpaperApp:
    type: application
    platform: iOS
    sources:
      - App
    dependencies:
      - package: WallpaperKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gabor.wallpaperapp
        INFOPLIST_KEY_CFBundleDisplayName: Wallpaper
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: "YES"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.9"

schemes:
  WallpaperApp:
    build:
      targets:
        WallpaperApp: all
    archive:
      config: Release
